<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>HelpDesk</title>
  <!-- Подключаем стили напрямую как обычный статический файл
  <link rel="stylesheet" href="style.css"> -->
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Заявки (HelpDesk)</h1>
      <button id="add-ticket-btn" class="btn">Добавить тикет</button>
    </div>
    
    <div id="loading-spinner" class="spinner hidden">Загрузка...</div>
    <div id="tickets-container" class="tickets-list"></div>
  </div>

  <!-- Модалка: Добавить / Редактировать -->
  <div id="ticket-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Добавить тикет</h3>
      <form id="ticket-form">
        <input type="hidden" id="ticket-id">
        <div class="form-group">
          <label for="ticket-name">Краткое описание</label>
          <input type="text" id="ticket-name" required>
          <!-- Блок для вывода текста ошибки -->
          <span id="ticket-name-error" class="error-message hidden">Это поле обязательно для заполнения</span>
        </div>
        <div class="form-group">
          <label for="ticket-desc">Подробное описание</label>
          <textarea id="ticket-desc" rows="4"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn btn-secondary">Отмена</button>
          <button type="submit" class="btn">Ок</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модалка: Удаление -->
  <div id="delete-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Удалить тикет</h3>
      <p>Вы уверены, что хотите удалить этот тикет? Это действие необратимо.</p>
      <div class="modal-actions">
        <button id="delete-cancel" class="btn btn-secondary">Отмена</button>
        <button id="delete-confirm" class="btn btn-danger">Удалить</button>
      </div>
    </div>
  </div>
</body>
</html>
